name: build-image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Push the verified image to GHCR
        required: true
        type: boolean
        default: false
      recovery_isolation:
        description: Run only credential-free whole-stack recovery fixture preparation
        required: true
        type: boolean
        default: false
      thp_isolation:
        description: Run only per-process THP mechanism and single-factor ClickHouse ABBA; never publish
        required: true
        type: boolean
        default: false
      memory_isolation:
        description: Run only the credential-free v33 memory ABBA experiment; never publish
        required: true
        type: boolean
        default: false
  push:
    tags:
      - v1.29.4-rawoss

permissions:
  contents: read
  packages: write

env:
  VERSION: 1.29.4-rawoss
  LOCAL_IMAGE: local/rds-binlog-insight:1.29.4-rawoss
  LOCAL_CLICKHOUSE_IMAGE: local/rds-binlog-insight-clickhouse:1.29.4-rawoss

jobs:
  recovery-isolation:
    if: github.event_name == 'workflow_dispatch' && inputs.recovery_isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Preserve production disk safety floor on the disposable hosted runner
        run: |
          python -m unittest tests.test_recovery_runner -v
          python -u -m tools.recovery_fixture33.prepare_runner
      - name: Install fixture protocol SDK from the application lock
        run: python -m pip install "$(grep '^oss2==' requirements.txt)"
      - name: Recovery fixture contract tests
        run: python -m unittest tests.test_recovery_isolation33 tests.test_recovery_cloud_edge tests.test_recovery_archive_probe tests.test_recovery_bootstrap -v
      - name: Prepare isolated native binlog and independent input oracle
        run: python -u -m tools.recovery_isolation33
      - name: Make stopped fixture evidence readable
        if: always()
        run: |
          test "$GITHUB_ACTIONS" = true
          if [ -f "$GITHUB_WORKSPACE/runner-disk33.json" ]; then
            mkdir -p "$GITHUB_WORKSPACE/recovery-evidence"
            cp -n "$GITHUB_WORKSPACE/runner-disk33.json" "$GITHUB_WORKSPACE/runner-disk33.json.sha256" "$GITHUB_WORKSPACE/recovery-evidence/"
          fi
          if [ -d "$GITHUB_WORKSPACE/recovery-evidence" ]; then
            sudo chmod -R a+rX -- "$GITHUB_WORKSPACE/recovery-evidence"
          else
            echo 'No fixture evidence directory; preparation did not start'
          fi
      - name: Preserve all recovery evidence, including failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recovery-isolated33
          path: recovery-evidence/
          if-no-files-found: error
          retention-days: 30

  memory-isolation:
    if: github.event_name == 'workflow_dispatch' && (inputs.memory_isolation || inputs.thp_isolation)
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Verify fixture safety contracts
        run: python -m unittest tests.test_memory_isolation33 tests.test_thp_isolation33 -v
      - name: Run isolated same-version ABBA without production credentials
        env:
          THP_EXPERIMENT: ${{ inputs.thp_isolation }}
        run: |
          if [ "$THP_EXPERIMENT" = "true" ]; then
            python -u -m tools.thp_isolation33
          else
            python -u tools/memory_isolation33.py
          fi
      - name: Preserve measurements even when a gate fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: memory-isolated33
          path: memory-evidence/
          if-no-files-found: error
          retention-days: 14

  build-test-package:
    if: github.event_name != 'workflow_dispatch' || (!inputs.memory_isolation && !inputs.thp_isolation && !inputs.recovery_isolation)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reject credentials and deployment identifiers in source
        run: python tools/public_sanitization_check.py

      - name: Set image coordinates
        shell: bash
        run: |
          set -euo pipefail
          echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build once in cloud CI
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: |
            ${{ env.LOCAL_IMAGE }}
            ${{ env.GHCR_IMAGE }}:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build credential-enabled ClickHouse in cloud CI
        uses: docker/build-push-action@v7
        with:
          context: .
          file: clickhouse/Dockerfile
          load: true
          push: false
          tags: |
            ${{ env.LOCAL_CLICKHOUSE_IMAGE }}
            ${{ env.GHCR_IMAGE }}:clickhouse-${{ env.VERSION }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=clickhouse
          cache-to: type=gha,scope=clickhouse,mode=max

      - name: Verify indexed query isolation in a bounded Linux process tree
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --memory=1g --memory-swap=1g --cpus=0.5 --pids-limit=64 \
            --read-only --tmpfs /tmp:rw,size=128m,mode=1777 \
            -e OMP_NUM_THREADS=1 -e OPENBLAS_NUM_THREADS=1 -e ARROW_NUM_THREADS=1 \
            --entrypoint sh --workdir /src --volume "$PWD:/src:ro" "$LOCAL_IMAGE" -ec '
              python -c "from pathlib import Path; p=Path(\"/sys/fs/cgroup\"); assert int((p/\"memory.max\").read_text()) == 1073741824; assert int((p/\"memory.swap.max\").read_text()) == 0; q,t=map(int,(p/\"cpu.max\").read_text().split()); assert q/t <= 0.5; print(\"query process-tree limits verified\")"
              python -m unittest tests.test_indexed_query_worker tests.test_indexed_parquet_contract -v
            '

      - name: Run release regression suite
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint python \
            --workdir /src \
            --volume "$PWD:/src:ro" \
            "$LOCAL_IMAGE" \
            -m unittest \
            tests.test_raw_binlog \
            tests.test_binlog_query_batches \
            tests.test_raw_event_index \
            tests.test_binlog_rows \
            tests.test_sync_lifecycle \
            tests.test_rds_download \
            tests.test_core \
            tests.test_parser_buffering \
            tests.test_pipeline_capacity \
            tests.test_pipeline_stage_timing \
            tests.test_sync_discovery \
            tests.test_all_source_routing \
            tests.test_query_preflight \
            tests.test_search_index_cancellation \
            tests.test_cloud_credentials \
            tests.test_oss_crc \
            tests.test_clickhouse_credentials \
            tests.test_clickhouse_oss \
            tests.test_clickhouse_hot \
            tests.test_clickhouse_query_lifecycle.ClickHouseQueryLifecycle \
            tests.test_clickhouse_raw_worker \
            tests.test_clickhouse_slowlog \
            tests.test_clickhouse_slowlog_verify \
            tests.test_slowlog_collector \
            tests.test_slowlog_index \
            tests.test_slowlog_table_filters \
            tests.test_slowlog_event_execution \
            tests.test_serving_handoff \
            tests.test_sqlite_serving_performance \
            tests.test_slowlog_correlation \
            tests.test_slowlog_correlation_engines \
            tests.test_slowlog_impact \
            tests.test_mongo_insight \
            tests.test_resource_attribution \
            tests.test_mongo_collector \
            tests.test_pod_lookup \
            tests.test_clickhouse_stage \
            tests.test_clickhouse_oss_verify \
            tests.test_clickhouse_poc_benchmark \
            tests.test_index_worker \
            tests.test_metadata_wal \
            tests.test_chunk_progress \
            tests.test_local_execution_detail \
            tests.test_public_config
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$LOCAL_IMAGE")" = "$VERSION"
          docker run --rm --entrypoint python "$LOCAL_IMAGE" -c \
            "import sqlite3; assert sqlite3.sqlite_version == '3.53.4'"

      - name: Benchmark bounded raw-event covering index fixture
        shell: bash
        run: |
          docker run --rm --cpus=1 --memory=768m --pids-limit=128 \
            --entrypoint python --workdir /src --volume "$PWD:/src:ro" \
            "$LOCAL_IMAGE" -m tools.benchmark_index_layout --raw-event-index --rows 16384

      - name: Verify workspace rendering and disclosure contracts
        run: node --test tests/test_workspace.cjs tests/test_workspace_impact.cjs tests/test_mongo_workspace.cjs tests/test_sync_lifecycle.cjs tests/test_sync_status.cjs tests/test_indexed_range.cjs

      - name: Verify Mongo, slow-log filters and raw candidate versions against isolated ClickHouse
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name mongo-ci-clickhouse -p 127.0.0.1:18123:8123 \
            -e CLICKHOUSE_DB=mongo_ci_fixture -e CLICKHOUSE_USER=fixture \
            -e CLICKHOUSE_PASSWORD=fixture-ci-only \
            "$LOCAL_CLICKHOUSE_IMAGE"
          trap 'docker logs --tail 30 mongo-ci-clickhouse; docker rm -f mongo-ci-clickhouse' EXIT
          for n in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18123/ping; then break; fi
            sleep 2
          done
          docker run --rm --network host --entrypoint python --workdir /src \
            --volume "$PWD:/src:ro" \
            -e MONGO_CI_FIXTURE=1 -e SLOWLOG_CI_FIXTURE=1 -e RAW_CANDIDATE_CI_FIXTURE=1 \
            -e RDS_BINLOG_CLICKHOUSE_DATABASE=mongo_ci_fixture \
            -e RDS_BINLOG_CLICKHOUSE_HOST=127.0.0.1 -e RDS_BINLOG_CLICKHOUSE_PORT=18123 \
            -e CLICKHOUSE_USER=fixture -e CLICKHOUSE_PASSWORD=fixture-ci-only \
            "$LOCAL_IMAGE" -m unittest tests.test_mongo_clickhouse tests.test_slowlog_table_filters.SlowLogTableFiltersClickHouse tests.test_raw_candidate_clickhouse tests.test_clickhouse_query_lifecycle.ClickHouseQueryLifecycleIntegration -v

      - name: Verify native SDK rotation and graceful credential supervisor stop
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name credentials-ci-clickhouse -p 127.0.0.1:18123:8123 \
            --entrypoint python3 --workdir /src --volume "$PWD:/src:ro" \
            -e CLICKHOUSE_DB=default -e CLICKHOUSE_USER=fixture \
            -e CLICKHOUSE_PASSWORD=fixture-ci-only \
            "$LOCAL_CLICKHOUSE_IMAGE" -m tests.clickhouse_credential_fixture
          trap 'docker logs --tail 40 credentials-ci-clickhouse; docker rm -f credentials-ci-clickhouse' EXIT
          for n in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18123/ping; then break; fi
            sleep 2
          done
          started=$(docker inspect --format '{{.State.StartedAt}}' credentials-ci-clickhouse)
          query="SELECT sum(value) FROM s3('http://127.0.0.1:31812/bucket/file.csv', 'CSV', 'value UInt8') SETTINGS use_query_cache=0"
          test "$(curl -fsS --user fixture:fixture-ci-only --data-binary "$query" http://127.0.0.1:18123/)" = 7
          docker exec credentials-ci-clickhouse python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:31812/rotate').read()"
          sleep 3
          test "$(curl -fsS --user fixture:fixture-ci-only --data-binary "$query" http://127.0.0.1:18123/)" = 7
          docker exec credentials-ci-clickhouse python3 -c "import urllib.request,json; d=json.load(urllib.request.urlopen('http://127.0.0.1:31812/evidence')); assert {1,2}.issubset(d['reads']) and d['failures']==0, d; print(d)"
          test "$(docker inspect --format '{{.State.StartedAt}}' credentials-ci-clickhouse)" = "$started"
          docker stop --time 60 credentials-ci-clickhouse
          test "$(docker inspect --format '{{.State.ExitCode}}' credentials-ci-clickhouse)" = 0

      # Keep the full-history publication gate unconditional, while allowing
      # isolated cloud regression tests to diagnose unrelated historical debt.
      - name: Reject sensitive Git history before any artifact export
        run: python tools/public_sanitization_check.py --history

      - name: Export immutable deployment artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          docker save "$LOCAL_IMAGE" | gzip -1 > "dist/rds-binlog-insight-${VERSION}.tar.gz"
          sha256sum "dist/rds-binlog-insight-${VERSION}.tar.gz" \
            > "dist/rds-binlog-insight-${VERSION}.tar.gz.sha256"
          docker image inspect --format '{{.Id}}' "$LOCAL_IMAGE" \
            > "dist/rds-binlog-insight-${VERSION}.image-id.txt"
          docker image inspect --format '{{.Id}}' "$LOCAL_CLICKHOUSE_IMAGE" \
            > "dist/rds-binlog-insight-clickhouse-${VERSION}.image-id.txt"
          cp compose.yaml "dist/compose-${VERSION}.yaml"
          cp docs/clickhouse-oss-v3-runbook.md \
            "dist/clickhouse-oss-v3-runbook-${VERSION}.md"
          printf '%s\n' "$GITHUB_SHA" \
            > "dist/rds-binlog-insight-${VERSION}.source-sha.txt"
          sha256sum \
            "dist/compose-${VERSION}.yaml" \
            "dist/clickhouse-oss-v3-runbook-${VERSION}.md" \
            "dist/rds-binlog-insight-${VERSION}.source-sha.txt" \
            > "dist/rds-binlog-insight-${VERSION}.metadata.sha256"

      - name: Upload cloud-built deployment artifact
        uses: actions/upload-artifact@v7
        with:
          name: rds-binlog-insight-${{ env.VERSION }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Authenticate to GHCR
        if: github.event_name == 'push' || inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image
        if: github.event_name == 'push' || inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          docker push "$GHCR_IMAGE:$VERSION"
          docker push "$GHCR_IMAGE:clickhouse-$VERSION"
