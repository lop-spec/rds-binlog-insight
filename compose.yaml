  clickhouse-slowlog-ingester:
    image: local/rds-binlog-insight:1.26.4-rawoss
    container_name: rds-binlog-insight-clickhouse-slowlog-ingester
    restart: unless-stopped
    logging: *runtime-logging
    init: true
    user: "${RDS_BINLOG_UID:-1000}:${RDS_BINLOG_GID:-1000}"
    env_file:
      - .env
      - ./clickhouse/runtime.env
    environment:
      TZ: Asia/Shanghai
      RDS_BINLOG_DATA_DIR: /data
      TMPDIR: /data/scratch
      RDS_BINLOG_CLICKHOUSE_ENABLED: "1"
      RDS_BINLOG_CLICKHOUSE_SERVING_ENABLED: "0"
      RDS_BINLOG_CLICKHOUSE_HOST: rds-binlog-insight-clickhouse
      RDS_BINLOG_CLICKHOUSE_PORT: "8123"
      RDS_BINLOG_CLICKHOUSE_DATABASE: insight
      RDS_BINLOG_CLICKHOUSE_TABLE: events
      RDS_BINLOG_CLICKHOUSE_SLOWLOG_ENABLED: "1"
      RDS_BINLOG_CLICKHOUSE_SLOWLOG_SERVING_ENABLED: "0"
      RDS_BINLOG_CLICKHOUSE_SLOWLOG_TABLE: slowlog_events
      RDS_BINLOG_CLICKHOUSE_SLOWLOG_RETENTION_DAYS: "61"
      # This is one serial commit, not 64 concurrent writers.  The exporter
      # streams rows in 8192-row chunks and coalesces the many tiny source
      # parts into one Parquet insert; the API canary, host PSI admission and
      # explicit inter-batch pacing bound every batch without io.max.
      RDS_BINLOG_CLICKHOUSE_SLOWLOG_BATCH_PARTS: "64"
      # The MySQL collector already polls every 120 seconds.  A 30-second
      # bounded reconciliation keeps ClickHouse within one short poll behind
      # the exact SQLite index while preserving the full sweep as crash repair.
      RDS_BINLOG_CLICKHOUSE_SLOWLOG_RECONCILE_SECONDS: "30"
      RDS_BINLOG_CLICKHOUSE_SLOWLOG_IDLE_SECONDS: "5"
      # Protect the exact SQLite fallback while historical ClickHouse work is
      # sharing the same disk.  The ingester reads the source worker's atomic
      # status file and resumes automatically only after hysteresis recovery.
      RDS_BINLOG_CLICKHOUSE_SLOWLOG_SOURCE_MAX_PENDING_PARTS: "128"
      RDS_BINLOG_CLICKHOUSE_SLOWLOG_SOURCE_MAX_PENDING_AGE_SECONDS: "600"
      RDS_BINLOG_CLICKHOUSE_SLOWLOG_SOURCE_RECOVERY_RATIO: "0.8"
      RDS_BINLOG_CLICKHOUSE_SLOWLOG_SOURCE_STATUS_STALE_SECONDS: "30"
      RDS_BINLOG_CLICKHOUSE_HEALTH_URL: http://insight:8769/api/storage
      RDS_BINLOG_CLICKHOUSE_HEALTH_HOST: "${RDS_BINLOG_ALLOWED_HOSTS:-127.0.0.1}"
      RDS_BINLOG_CLICKHOUSE_HEALTH_MAX_SECONDS: "1"
      RDS_BINLOG_CLICKHOUSE_MIN_FREE_GB: "120"
      RDS_BINLOG_CLICKHOUSE_IO_FULL_AVG10_MAX: "${RDS_BINLOG_CLICKHOUSE_SLOWLOG_BACKFILL_IO_FULL_AVG10_MAX:-10}"
      RDS_BINLOG_CLICKHOUSE_IO_RECOVERY_RATIO: "0.8"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      ARROW_NUM_THREADS: "1"
    command:
      - ionice
      - -c
      - "3"
      - nice
      - -n
      - "15"
      - python
      - -m
      - app.clickhouse_slowlog
      - --data-dir
      - /data
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /data/scratch:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 1g
    cpus: "0.5"
    blkio_config:
      weight: 10
    stop_grace_period: 30s
    healthcheck:
      disable: true
    depends_on:
      insight:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

